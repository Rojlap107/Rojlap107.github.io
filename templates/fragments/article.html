
      <article class="art">

        <header class="art-head">
          <p class="art-cat">{{SECTION_CHIP}}</p>
          <h1>{{TITLE}}</h1>
          <p class="art-standfirst">{{STANDFIRST}}</p>
          <div class="art-byline">
            {{AVATAR}}
            <div class="who">
              <a class="nm" href="{{AUTHOR_HREF}}">{{AUTHOR}}</a>
              <span class="dt"><time datetime="{{DATE_ISO}}">{{DATE}}</time> · {{MINS}} min read</span>
            </div>
            <div class="art-share">
          <span class="lbl">Share</span>
          <a class="sh sh-fb" href="#" data-share="facebook" aria-label="Share on Facebook"><svg class="ic" aria-hidden="true"><use href="#ic-facebook"/></svg></a>
          <a class="sh sh-em" href="#" data-share="email" aria-label="Share by email"><svg class="ic" aria-hidden="true"><use href="#ic-mail"/></svg></a>
          <button class="sh sh-cp" type="button" data-share="copy" aria-label="Copy link"><svg class="ic" aria-hidden="true"><use href="#ic-link"/></svg><span class="done"><svg class="ic" aria-hidden="true"><use href="#ic-check"/></svg> Copied</span></button>
        </div>
          </div>
        </header>

        <figure class="art-lede">
          <img src="{{LEDE}}" alt="">{{LEDE_CAP}}
        </figure>

        <div class="art-body">
{{BODY}}
        </div>

        <div class="art-share-foot">
          <div class="art-share">
          <span class="lbl">Share</span>
          <a class="sh sh-fb" href="#" data-share="facebook" aria-label="Share on Facebook"><svg class="ic" aria-hidden="true"><use href="#ic-facebook"/></svg></a>
          <a class="sh sh-em" href="#" data-share="email" aria-label="Share by email"><svg class="ic" aria-hidden="true"><use href="#ic-mail"/></svg></a>
          <button class="sh sh-cp" type="button" data-share="copy" aria-label="Copy link"><svg class="ic" aria-hidden="true"><use href="#ic-link"/></svg><span class="done"><svg class="ic" aria-hidden="true"><use href="#ic-check"/></svg> Copied</span></button>
        </div>
        </div>
{{NOTES}}
        <aside class="art-author">
          {{AUTHOR_PIC}}
          <div>
            <p class="k">About the author</p>
            <h3><a href="{{AUTHOR_HREF}}">{{AUTHOR}}</a></h3>
            <p>{{BIO}}</p>
          </div>
        </aside>

        <div class="art-lower">
          <aside class="art-mustread">
            <h2 class="th-h3">Must Read</h2>
            <div class="th-divL"><i></i><b></b></div>
            <ol>
{{MUSTREAD}}
            </ol>
          </aside>

          <section class="art-related">
            <h2 class="th-h3">You may also like</h2>
            <div class="th-divL"><i></i><b></b></div>
            <div class="th-cards">
{{RELATED}}
            </div>
          </section>
        </div>

      </article>
